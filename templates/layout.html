<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
        {% block title %}
            Django App
        {% endblock %}
    </title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <script src="{% static 'js/main.js' %}" defer></script>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
</head>
<body>


    <nav>
        <a href="/">
            <span title="Home">
                Home
            </span>
        </a> |
        <a href="{% url 'lakes:list' %}">
            <span title="Lake Information">
                Lake Information
            </span>
        </a> |
        {% if user.is_authenticated %}
        <a href="{% url 'quiz:saved_results' %}">
            <span title="My Results">
                My Results
            </span>
        </a> |
        <form action="{% url 'users:logout' %}" method="post" style="display: inline;">
            {% csrf_token %}
            <button type="submit" class="logout-btn">Logout</button>
        </form>
        {% else %}
        <a href="{% url 'users:login' %}">
            <span title="Login">
                Login
            </span>
        </a> |
        <a href="{% url 'users:signup' %}">
            <span title="Sign up">
                Sign up
            </span>
        </a>
        {% endif %}
    </nav>


    <main>
        <div class="page-wrapper">
            <div class="content-card">
                        {% block content %}
                        {% endblock %}
            </div>
        </div>
    </main>


    <footer class="footer">
        <p>Data sourced from <a href="https://wldb.ilec.or.jp">International Lake Environment Committee Foundation</a> page.</p>
    </footer>


</body>
</html>
