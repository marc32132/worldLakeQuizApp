{% extends "layout.html" %}

{% block content %}
<h2 class="mb-4">
    My Quiz History
</h2>
<span class="badge bg-success">
    {{ results|length }} quizzes
</span>
{% if results %}
    <div id="resultsContainer">
        {% include "quiz/partials/results_history.html" %}
    </div>
    <p class="mt-3 ms-auto text-light">
        {{ paginated_results.paginator.per_page }} results per page
    </p>
    
{% else %}
    <p class="text-center text-light my-5">
        You have no saved results yet.
    </p>
{% endif %}



{% endblock %}
