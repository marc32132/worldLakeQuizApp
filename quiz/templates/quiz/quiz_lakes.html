{% extends 'layout.html' %}

{% block title %}
    World Lakes
{% endblock %}

{% block content %}

    <h2>World Lakes Quiz</h1>
    
    <!-- Quiz form: displays multiple-choice questions dynamically from quiz_data -->
    <form class="quiz-form" method="post" action="{% url 'quiz:quiz_lakes' %}">
        {% csrf_token %}

        {% for q in quiz_data %}
            <!-- Single question block -->
            <div class="question-block">
                <br><h3> {{ forloop.counter }}. What country is <span class="quiz-lake-name">{{ q.name }}</span> located in?</h3><br>
        
                {% for option in q.options %}
                <label class="answer-container">
                    <input type="radio" name="{{q.id}}" value="{{ option }}">
                    <span class="checkmark"></span>
                    {{ option }}
                </label>
                {% endfor %}
            </div>
        {% endfor %}
        <button class="form-submit">Submit</button>
    </form>
    
      

{% endblock %}
